<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Group 5 FC</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

/* BACKGROUND */
.bg{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1600&q=80')
  center/cover no-repeat;
  animation:zoom 18s infinite alternate;
  z-index:-2;
}

@keyframes zoom{
  0%{transform:scale(1)}
  100%{transform:scale(1.1)}
}

.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.75);
  z-index:-1;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 60px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  color:#00ff88;
  font-weight:bold;
  letter-spacing:2px;
}

/* NAV */
#sidebar{
  display:flex;
  gap:20px;
}

#sidebar a{
  color:#fff;
  text-decoration:none;
  position:relative;
}

#sidebar a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-5px;
  width:0;
  height:2px;
  background:#00ff88;
  transition:.3s;
}

#sidebar a:hover::after{
  width:100%;
}

/* MENU BTN */
.menu-btn{
  display:none;
  font-size:28px;
  color:#00ff88;
  cursor:pointer;
}

/* HERO */
.hero{
  text-align:center;
  padding:110px 20px 40px;
}

.hero h1{
  font-size:48px;
  color:#00ff88;
}

.hero p{
  color:#ddd;
  margin-top:10px;
}

/* GALLERY */
.section{
  padding:60px 20px;
  max-width:1200px;
  margin:auto;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:12px;
  transition:0.3s ease;
  border:2px solid rgba(255,255,255,0.1);
}

.gallery img:hover{
  transform:scale(1.08);
  box-shadow:0 10px 25px rgba(0,255,136,0.25);
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  background:rgba(0,0,0,0.7);
  color:#aaa;
  margin-top:40px;
}

/* MOBILE SIDEBAR */
@media(max-width:768px){

  header{
    padding:15px 20px;
  }

  .menu-btn{
    display:block;
  }

  #sidebar{
    position:fixed;
    top:0;
    right:-260px;
    width:250px;
    height:100vh;
    background:rgba(0,0,0,0.95);
    backdrop-filter:blur(10px);
    flex-direction:column;
    padding:80px 20px;
    gap:25px;
    transition:0.3s;
    z-index:2000;
  }

  #sidebar.active{
    right:0;
  }

  #sidebar a{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<header>
  <div class="logo">⚽ GROUP 5 FC</div>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <nav id="sidebar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="squad.html">Squad</a>
    <a href="matches.html">Matches</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
    <a href="developers.html">Developers</a>
  </nav>
</header>

<section class="hero">
  <h1>Gallery</h1>
  <p>Moments, memories, and highlights of Group 5 FC</p>
</section>

<section class="section">
<div class="gallery">

  <img src="image1.jpg">
  <img src="image2.jpg">
  <img src="image3.jpg">
  <img src="image4.jpg">
  <img src="image1.jpg">
  <img src="image1.jpg">

</div>
</section>

<footer>
<p>© 2026 Group 5 FC | Gallery Page</p>
</footer>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("active");
}

document.querySelectorAll("#sidebar a").forEach(link => {
  link.addEventListener("click", () => {
    document.getElementById("sidebar").classList.remove("active");
  });
});
</script>

</body>
</html>
