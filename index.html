<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group 5 FC</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* BACKGROUND */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#000,#0a0a0a);
  animation:fadeBg 3s infinite alternate;
  z-index:-1;
}

@keyframes fadeBg{
  0%{filter:brightness(1)}
  100%{filter:brightness(1.3)}
}

/* CONTAINER */
.container{
  text-align:center;
  animation:zoom 1.5s ease;
}

@keyframes zoom{
  from{transform:scale(0.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* LOGO IMAGE */
.logo img{
  width:160px;
  height:160px;
  object-fit:contain;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,255,136,0.3);
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translateY(0px)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0px)}
}

/* TEXT */
.subtitle{
  color:#aaa;
  font-size:16px;
  margin-top:15px;
}

/* LOADER */
.loader{
  width:180px;
  height:4px;
  background:#222;
  margin:25px auto 0;
  border-radius:10px;
  overflow:hidden;
}

.loader::before{
  content:'';
  display:block;
  height:100%;
  width:0;
  background:#00ff88;
  animation:load 6s linear forwards;
}

@keyframes load{
  to{width:100%}
}

/* MOBILE */
@media(max-width:600px){
  .logo img{
    width:120px;
    height:120px;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <!-- LOGO IMAGE -->
  <div class="logo">
    <img src="logo.jpeg" alt="Group 5 FC Logo">
  </div>

  <div class="subtitle">Welcome to Group 5 FC</div>

  <div class="loader"></div>

</div>

<script>
setTimeout(() => {
  window.location.href = "home.html";
}, 6000);
</script>

</body>
</html>
